<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Konfirmasi Pelunasan - Ngebut.in Admin</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  </head>
  <body class="dashboard-layout">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="mobile-admin-nav">
        <button class="sidebar-toggle-btn" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <img src="../assets/img/logo.png" alt="Logo" style="height: 35px; mix-blend-mode: multiply;">
        <div style="width: 24px;"></div>
    </div>

    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="../index.html" class="logo" style="display: flex; align-items: center; justify-content: center; margin-bottom: 1rem;">
          <img src="../assets/img/logo.png" alt="Ngebut.in Logo" style="height: 70px; width: auto; object-fit: contain; mix-blend-mode: multiply;">
        </a>
        <div class="user-profile">
          <div class="user-avatar" id="adminAvatar"></div>
          <div class="user-info">
            <h4 id="adminName">Administrator</h4>
            <p><i class="fas fa-shield-alt"></i> Super Admin</p>
          </div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item"><i class="fas fa-chart-pie"></i> Dashboard</a>
        <a href="kendaraan.html" class="nav-item"><i class="fas fa-motorcycle"></i> Kelola Kendaraan</a>
        <a href="booking.html" class="nav-item"><i class="fas fa-shield-check"></i> Verifikasi DP</a>
        <a href="pembayaran.html" class="nav-item active"><i class="fas fa-money-bill-wave"></i> Konfirmasi Pelunasan</a>
        <a href="users.html" class="nav-item"><i class="fas fa-users"></i> Manajemen User</a>
        <a href="profil.html" class="nav-item"><i class="fas fa-user-circle"></i> Profil</a>
        <a href="#" class="nav-item logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div class="page-title">
          <h1><i class="fas fa-money-bill-wave" style="color:var(--primary);"></i> Konfirmasi Pelunasan</h1>
          <p>Kelola pengembalian motor dan verifikasi pembayaran pelunasan</p>
        </div>
        <div style="display:flex;gap:12px;align-items:center;">
          <button class="btn-secondary" onclick="loadData()"><i class="fas fa-sync-alt"></i> Refresh</button>
          <button class="btn-primary" onclick="exportToCSV()"><i class="fas fa-file-csv"></i> CSV</button>
        </div>
      </div>

      <div id="notificationArea"></div>

      <!-- Filter Tabs -->
      <div class="filter-tabs" style="margin-bottom:20px;">
        <button class="filter-tab active" id="tab-return" onclick="setFilter('return', this)">
          <i class="fas fa-undo"></i> Menunggu Pelunasan
          <span class="badge" id="badge-return" style="background:var(--primary);color:#fff;border-radius:999px;padding:2px 8px;font-size:11px;margin-left:6px;"></span>
        </button>
        <button class="filter-tab" id="tab-verif" onclick="setFilter('verif', this)">
          <i class="fas fa-search"></i> Verifikasi Pelunasan
          <span class="badge" id="badge-verif" style="background:#f59e0b;color:#fff;border-radius:999px;padding:2px 8px;font-size:11px;margin-left:6px;"></span>
        </button>
        <button class="filter-tab" id="tab-done" onclick="setFilter('done', this)">
          <i class="fas fa-check-circle"></i> Selesai
        </button>
        <button class="filter-tab" id="tab-all" onclick="setFilter('all', this)">
          <i class="fas fa-list"></i> Semua
        </button>
      </div>

      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Penyewa</th>
              <th>Motor</th>
              <th>Tanggal Sewa</th>
              <th>Total / Sisa</th>
              <th>Bukti Pelunasan</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="pelunasanTable">
            <tr><td colspan="8" style="text-align:center;padding:3rem;">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </main>

    <!-- Preview Bukti Pelunasan -->
    <div class="dp-preview-overlay" id="buktiPreview" onclick="this.classList.remove('show')">
        <img id="buktiPreviewImg" src="" alt="Bukti Pelunasan">
    </div>

    <script src="../assets/js/api-client.js"></script>
    <script src="../assets/js/script.js"></script>
    <script>
        const user = getCurrentUser();
        if (!user || user.role !== 'admin') window.location.href = '../login.html';

        renderAvatar('#adminAvatar', user.nama, user.foto_profil, 50);
        document.getElementById('adminName').textContent = user.nama || 'Administrator';

        let currentFilter = 'return';
        let allBookings = [];

        function setFilter(f, el) {
            currentFilter = f;
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            if (el) el.classList.add('active');
            renderTable();
        }

        async function loadData() {
            try {
                const data = await ApiClient.get('/bookings');
                allBookings = Array.isArray(data) ? data : [];
                allBookings.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
                updateBadges();
                renderTable();
            } catch (e) {
                document.getElementById('pelunasanTable').innerHTML = `<tr><td colspan="8" style="text-align:center;color:red;">Gagal memuat data: ${e.message}</td></tr>`;
            }
        }

        function updateBadges() {
            const ret = allBookings.filter(b => b.status === 'returning' && b.statusPembayaran === 'menunggu_pelunasan').length;
            const verif = allBookings.filter(b => b.status === 'returning' && b.statusPembayaran === 'pelunasan_uploaded').length;
            document.getElementById('badge-return').textContent = ret || '';
            document.getElementById('badge-verif').textContent = verif || '';
        }

        function getFiltered() {
            if (currentFilter === 'return') return allBookings.filter(b => b.status === 'returning' && (b.statusPembayaran === 'menunggu_pelunasan' || b.statusPembayaran === 'pelunasan_uploaded'));
            if (currentFilter === 'verif') return allBookings.filter(b => b.status === 'returning' && b.statusPembayaran === 'pelunasan_uploaded');
            if (currentFilter === 'done') return allBookings.filter(b => b.status === 'completed');
            return allBookings.filter(b => ['returning','completed'].includes(b.status));
        }

        function renderTable() {
            const list = getFiltered();
            const tbody = document.getElementById('pelunasanTable');
            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:3rem;color:var(--gray-500);">
                    <i class="fas fa-inbox" style="font-size:3rem;opacity:0.3;display:block;margin-bottom:1rem;"></i>
                    ${currentFilter === 'return' ? 'Tidak ada motor yang menunggu pelunasan.' :
                      currentFilter === 'verif' ? 'Tidak ada bukti pelunasan yang perlu diverifikasi.' :
                      currentFilter === 'done' ? 'Belum ada transaksi selesai.' : 'Tidak ada data.'}
                </td></tr>`;
                return;
            }

            tbody.innerHTML = list.map(b => {
                const sp = b.statusPembayaran || '';
                const total = b.totalHarga || 0;
                const dp = b.dpAmount || 0;
                const pelunasan = b.pelunasanAmount || (total - dp);
                const nama = b.userName || `User #${b.userId}`;
                const motor = b.motorName || `Motor #${b.motorId}`;
                const days = calculateDays(b.startDate, b.endDate);
                const bukti = b.buktiPelunasan || '';

                let badge = '', aksi = '';

                if (b.status === 'returning' && sp === 'menunggu_pelunasan') {
                    badge = `<span class="badge-dp badge-returning">⏳ MENUNGGU PELUNASAN</span>`;
                    aksi = `
                        <div style="display:flex;flex-direction:column;gap:6px;">
                            <span style="color:#9ca3af;font-size:11px;"><i class="fas fa-info-circle"></i> Menunggu user upload bukti</span>
                            <button class="btn-action btn-approve" onclick="completeCash(${b.id})" style="background:#059669;font-size:12px;">
                                <i class="fas fa-coins"></i> Lunas Tunai
                            </button>
                        </div>`;

                } else if (b.status === 'returning' && sp === 'pelunasan_uploaded') {
                    badge = `<span class="badge-dp badge-uploaded">🔍 VERIFIKASI PELUNASAN</span>`;
                    aksi = `
                        <div style="display:flex;flex-direction:column;gap:4px;">
                            <button class="btn-action btn-approve" onclick="approvePelunasan(${b.id})">
                                <i class="fas fa-check"></i> Konfirmasi Lunas
                            </button>
                            <button class="btn-action btn-approve" onclick="completeCash(${b.id})" style="background:#059669;font-size:12px;">
                                <i class="fas fa-coins"></i> Lunas Tunai
                            </button>
                        </div>`;

                } else if (b.status === 'completed') {
                    badge = `<span class="badge-dp badge-done">✅ SELESAI - LUNAS</span>`;
                    aksi = `<button class="btn-action btn-view" onclick="viewKwitansi(${b.id})">
                        <i class="fas fa-receipt"></i> Kwitansi</button>`;

                } else {
                    badge = `<span class="badge-dp" style="background:#f3f4f6;color:#374151;">${(b.status||'').toUpperCase()}</span>`;
                    aksi = '';
                }

                const buktiThumb = bukti
                    ? `<img src="${bukti}" style="width:50px;height:50px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid #e5e7eb;" onclick="previewBukti('${bukti}')" title="Klik untuk lihat" onerror="this.outerHTML='<span style=color:#ef4444>Error</span>'">`
                    : `<span style="color:#9ca3af;font-size:12px;"><i class="fas fa-minus"></i></span>`;

                return `
                    <tr>
                        <td><code>#${String(b.id).slice(-6)}</code></td>
                        <td><strong>${nama}</strong><br><small style="color:#9ca3af;">${b.userEmail||''}</small></td>
                        <td>${motor}<br><small style="color:#9ca3af;">${b.motorKategori||''}</small></td>
                        <td style="font-size:12px;">${formatShortDate(b.startDate)} →<br>${formatShortDate(b.endDate)}<br><small>${days} hari</small></td>
                        <td>
                            <strong>${formatRupiah(total)}</strong><br>
                            <small style="color:#059669;">DP: ${formatRupiah(dp)}</small><br>
                            <small style="color:var(--primary);font-weight:600;">Sisa: ${formatRupiah(pelunasan)}</small>
                        </td>
                        <td style="text-align:center;">${buktiThumb}</td>
                        <td>${badge}</td>
                        <td>${aksi}</td>
                    </tr>`;
            }).join('');
        }

        function previewBukti(src) {
            document.getElementById('buktiPreviewImg').src = src;
            document.getElementById('buktiPreview').classList.add('show');
        }

        async function approvePelunasan(bookingId) {
            if (!confirm(`Konfirmasi pelunasan untuk booking #${bookingId}?\nStatus akan menjadi SELESAI - LUNAS.`)) return;
            try {
                await ApiClient.put(`/bookings/${bookingId}/approve-pelunasan`, {});
                showNotif('✅ Pelunasan dikonfirmasi! Sewa selesai. Motor kembali tersedia.', 'success');
                await loadData();
            } catch(e) { showNotif('Gagal: ' + e.message, 'danger'); }
        }

        async function completeCash(bookingId) {
            if (!confirm(`Konfirmasi pelunasan TUNAI untuk booking #${bookingId}?\nStatus akan menjadi SELESAI - LUNAS.`)) return;
            try {
                await ApiClient.put(`/bookings/${bookingId}/complete-cash`, {});
                showNotif('✅ Pelunasan tunai dikonfirmasi! Sewa selesai.', 'success');
                await loadData();
            } catch(e) { showNotif('Gagal: ' + e.message, 'danger'); }
        }

        function viewKwitansi(bookingId) {
            const b = allBookings.find(x => String(x.id) === String(bookingId));
            if (!b) return;
            const total = b.totalHarga || 0;
            const dp = b.dpAmount || 0;
            const pelunasan = b.pelunasanAmount || (total - dp);
            const win = window.open('', '_blank');
            win.document.write(`<!DOCTYPE html><html><head><title>Kwitansi #${String(b.id).slice(-6)}</title>
            <style>
                body{font-family:Arial,sans-serif;max-width:600px;margin:40px auto;padding:20px;}
                .header{text-align:center;border-bottom:3px solid #cc0000;padding-bottom:15px;margin-bottom:20px;}
                .logo{font-size:28px;font-weight:900;color:#cc0000;letter-spacing:2px;}
                .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0;}
                .label{color:#666;font-size:14px;}
                .value{font-weight:600;font-size:14px;}
                .total-box{background:#fff5f5;padding:14px;border-radius:8px;margin-top:16px;}
                .lunas-badge{text-align:center;margin:20px 0;padding:12px;background:#dcfce7;border-radius:8px;color:#166534;font-weight:700;font-size:20px;letter-spacing:2px;}
                @media print{button{display:none}}
            </style></head><body>
            <div class="header">
                <div class="logo">🏍️ NGEBUT.IN</div>
                <h3 style="margin:8px 0;color:#333;">KWITANSI SEWA MOTOR</h3>
                <small style="color:#666;">No. Transaksi: <strong>#${String(b.id).slice(-6)}</strong></small>
            </div>
            <div class="row"><span class="label">Tanggal Transaksi</span><span class="value">${new Date(b.createdAt).toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'})}</span></div>
            <div class="row"><span class="label">Nama Penyewa</span><span class="value">${b.userName||'-'}</span></div>
            <div class="row"><span class="label">Motor</span><span class="value">${b.motorName||'-'} (${b.motorKategori||'-'})</span></div>
            <div class="row"><span class="label">Tanggal Mulai</span><span class="value">${b.startDate||'-'}</span></div>
            <div class="row"><span class="label">Tanggal Kembali</span><span class="value">${b.endDate||'-'}</span></div>
            <div class="row"><span class="label">Durasi</span><span class="value">${calculateDays(b.startDate, b.endDate)} hari</span></div>
            <div class="total-box">
                <div class="row" style="border:none;padding:4px 0;"><span class="label">Harga Per Hari</span><span class="value">Rp ${Number(b.motorHarga||0).toLocaleString('id-ID')}</span></div>
                <div class="row" style="border:none;padding:4px 0;"><span class="label">Total Sewa</span><span class="value">Rp ${Number(total).toLocaleString('id-ID')}</span></div>
                <div class="row" style="border:none;padding:4px 0;"><span class="label">DP (50%)</span><span class="value" style="color:#059669;">Rp ${Number(dp).toLocaleString('id-ID')}</span></div>
                <div class="row" style="border:none;padding:4px 0;"><span class="label">Pelunasan (50%)</span><span class="value" style="color:#cc0000;">Rp ${Number(pelunasan).toLocaleString('id-ID')}</span></div>
            </div>
            <div class="lunas-badge">✅ LUNAS</div>
            <p style="text-align:center;color:#9ca3af;font-size:12px;">Terima kasih telah menggunakan layanan NGEBUT.IN</p>
            <div style="text-align:center;margin-top:16px;">
                <button onclick="window.print()" style="background:#cc0000;color:#fff;border:none;padding:12px 28px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;">🖨️ Cetak Kwitansi</button>
            </div></body></html>`);
        }

        function exportToCSV() {
            if (allBookings.length === 0) { alert('Tidak ada data!'); return; }
            const list = allBookings.filter(b => ['returning','completed'].includes(b.status));
            const headers = ['ID', 'Penyewa', 'Motor', 'Tgl Mulai', 'Tgl Selesai', 'Total', 'DP', 'Pelunasan', 'Status'];
            const rows = list.map(b => [
                `#${String(b.id).slice(-6)}`,
                b.userName||'', b.motorName||'',
                b.startDate||'', b.endDate||'',
                b.totalHarga||0, b.dpAmount||0, b.pelunasanAmount||(b.totalHarga-b.dpAmount)||0,
                b.status||''
            ]);
            downloadCSV('Pelunasan_NgebutIN.csv', headers, rows, 'Laporan Pelunasan');
        }

        function showNotif(msg, type) {
            const area = document.getElementById('notificationArea');
            area.innerHTML = `<div class="notification notification-${type}">
                <span class="notification-icon"><i class="fas fa-${type==='success'?'check-circle':'times-circle'}"></i></span>
                <div class="notification-content"><div class="notification-title">${msg}</div></div>
                <span class="notification-close" onclick="this.parentElement.remove()">&times;</span>
            </div>`;
            setTimeout(() => area.innerHTML = '', 6000);
        }

        loadData();

        document.getElementById('sidebarToggle')?.addEventListener('click', () => {
            document.querySelector('.sidebar')?.classList.toggle('open');
            document.getElementById('sidebarOverlay')?.classList.toggle('show');
        });
        document.getElementById('sidebarOverlay')?.addEventListener('click', () => {
            document.querySelector('.sidebar')?.classList.remove('open');
            document.getElementById('sidebarOverlay')?.classList.remove('show');
        });
    </script>
  </body>
</html>
