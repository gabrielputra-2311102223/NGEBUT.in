<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pembayaran - Ngebut.in Admin</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <!-- Tambahan jsPDF & html2canvas sesuai spesifikasi laporan -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  </head>
  <body class="dashboard-layout">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="mobile-admin-nav">
        <button class="sidebar-toggle-btn" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <img src="../assets/img/logo.png" alt="Logo" style="height: 35px; mix-blend-mode: multiply;">
        <div style="width: 24px;"></div>
    </div>
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="../index.html" class="logo" style="display: flex; align-items: center; justify-content: center; margin-bottom: 1rem;">
          <img src="../assets/img/logo.png" alt="Ngebut.in Logo" style="height: 70px; width: auto; object-fit: contain; mix-blend-mode: multiply; filter: brightness(1.05) contrast(1.05);">
        </a>
        <div class="user-profile">
          <div class="user-avatar" id="adminAvatar"></div>
          <div class="user-info">
            <h4>Administrator</h4>
            <p><i class="fas fa-shield-alt"></i> Super Admin</p>
          </div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <i class="fas fa-chart-pie"></i> Dashboard
        </a>
        <a href="kendaraan.html" class="nav-item">
          <i class="fas fa-motorcycle"></i> Kelola Kendaraan
        </a>
        <a href="booking.html" class="nav-item">
          <i class="fas fa-shield-check"></i> Verifikasi DP
        </a>
        <a href="pembayaran.html" class="nav-item active">
          <i class="fas fa-credit-card"></i> Pembayaran
        </a>
        <a href="users.html" class="nav-item">
          <i class="fas fa-users"></i> Manajemen User
        </a>
        <a href="profil.html" class="nav-item">
          <i class="fas fa-user-circle"></i> Profil
        </a>
        <a href="#" class="nav-item logout" onclick="logout()">
          <i class="fas fa-sign-out-alt"></i> Logout
        </a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="page-header" style="display: flex; justify-content: space-between; align-items: center;">
        <div class="page-title">
          <h1>Manajemen Pembayaran</h1>
          <p>Konfirmasi pembayaran dan cetak kuitansi</p>
        </div>
        <div style="display: flex; gap: 10px;">
          <button class="btn btn-outline" onclick="exportToCSV()" title="Export CSV">
            <i class="fas fa-file-csv"></i>
          </button>
          <button class="btn btn-primary" onclick="exportToExcel()" style="background: #1D6F42; border-color: #1D6F42;">
            <i class="fas fa-file-excel"></i> Export Excel (Premium)
          </button>
        </div>
      </div>

      <div class="filter-tabs" style="margin-bottom: 1.5rem">
        <button class="filter-tab active" onclick="setFilter('booked', event)">
          <i class="fas fa-motorcycle"></i> Menunggu Pembayaran
        </button>
        <button class="filter-tab" onclick="setFilter('paid', event)">
          <i class="fas fa-check-circle"></i> Sudah Dibayar
        </button>
        <button class="filter-tab" onclick="setFilter('returning', event)">
          <i class="fas fa-undo"></i> Permintaan Kembali
        </button>
      </div>

      <div id="paymentGrid" class="motor-grid"></div>
    </main>

    <div id="invoiceModal" class="modal-overlay no-print">
      <div class="modal" style="max-width: 600px">
        <div class="modal-header no-print">
          <h3><i class="fas fa-receipt"></i> Kuitansi Pembayaran</h3>
          <button class="modal-close" onclick="closeInvoiceModal()">
            &times;
          </button>
        </div>
        <div class="modal-body" id="invoiceContent"></div>
        <div class="modal-footer no-print">
          <button class="btn btn-outline" onclick="closeInvoiceModal()">
            Tutup
          </button>
          <button class="btn btn-primary" onclick="printInvoice()">
            <i class="fas fa-print"></i> Cetak Kuitansi
          </button>
        </div>
      </div>
    </div>

    <script src="../assets/js/api-client.js?v=2.0"></script>
    <script src="../assets/js/script.js?v=2.0"></script>

    <script>
      const user = getCurrentUser();
      if (!user || user.role !== "admin") {
        window.location.href = "../login.html";
      }

      // Render avatar admin
      document.getElementById('adminAvatar').style.width = '50px';
      document.getElementById('adminAvatar').style.height = '50px';
      document.getElementById('adminAvatar').style.fontSize = '20px';
      renderAvatar('#adminAvatar', user.nama, user.foto_profil, 50);

      let currentFilter = "booked";
      let currentInvoiceData = null;

      function setFilter(filter, event) {
        currentFilter = filter;
        document
          .querySelectorAll(".filter-tab")
          .forEach((tab) => tab.classList.remove("active"));
        event.target.classList.add("active");
        renderPayments();
      }

      // Mengambil data dari backend API
      let allBookings = [];
      
      async function loadData() {
          try {
              const token = sessionStorage.getItem('token');
              const res = await fetch(API_URL + '/api/bookings', {
                  headers: { 'Authorization': 'Bearer ' + token }
              });
              if (!res.ok) throw new Error('Gagal memuat data');
              const data = await res.json();
              allBookings = Array.isArray(data) ? data : [];
              allBookings.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
              renderPayments();
          } catch(e) {
              document.getElementById('paymentGrid').innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: red;">Error: ${e.message}</div>`;
          }
      }

      function renderPayments() {
        const grid = document.getElementById("paymentGrid");
        
        let bookings = [...allBookings];

        // FILTER
        if (currentFilter === "booked") {
          bookings = bookings.filter((b) => b.status === "booked");
        } else if (currentFilter === "returning") {
          bookings = bookings.filter((b) => b.status === "returning");
        } else {
          bookings = bookings.filter((b) => b.status === "done" || b.status === "paid");
        }

        if (bookings.length === 0) {
          grid.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 4rem; color: var(--gray-500);">
                    <i class="fas fa-credit-card" style="font-size: 3rem; opacity: 0.3; margin-bottom: 1rem;"></i>
                    <h3>Tidak ada data</h3>
                </div>
            `;
          return;
        }

        grid.innerHTML = bookings
          .map((b) => {
            const days = calculateDays(b.startDate || b.tgl_mulai, b.endDate || b.tgl_selesai);
            const statusPembayaran = b.statusPembayaran || b.status_pembayaran || '';
            const motorImg = b.motorGambar || 'https://placehold.co/400x300/1A1A1A/white?text=Motor';
            
            // Logika Denda Keterlambatan
            const now = new Date();
            const endDateObj = new Date(b.endDate || b.tgl_selesai);
            now.setHours(0,0,0,0);
            endDateObj.setHours(0,0,0,0);
            
            let lateBadge = "";
            if (b.status === "paid" && now > endDateObj) {
                const lateDays = Math.ceil((now - endDateObj) / (1000 * 60 * 60 * 24));
                const denda = lateDays * 50000; // Denda Rp 50.000 / hari
                lateBadge = `<div style="color: var(--danger); font-size: 0.8rem; font-weight: bold; margin-top: 5px;"><i class="fas fa-exclamation-triangle"></i> Terlambat ${lateDays} Hari (Denda: ${formatRupiah(denda)})</div>`;
            }

            return `
                <div class="motor-card">
                    <div class="motor-image">
                        <img src="${motorImg}" onerror="this.src='https://placehold.co/400x300/1A1A1A/white?text=Motor'">
                        <span class="motor-badge ${['paid', 'done'].includes(b.status) ? 'badge-available' : 'badge-booked'}">
                            ${['paid', 'done'].includes(b.status) ? 'LUNAS' : 'BELUM LUNAS'}
                        </span>
                    </div>

                    <div class="motor-content">
                        <h3 class="motor-title">${b.motorName || b.motor_name || 'Motor'}</h3>

                        <p class="motor-desc">
                            <i class="fas fa-user"></i> ${b.userName || b.user_name || 'User'}<br>
                            <i class="fas fa-calendar"></i> ${formatShortDate(b.startDate || b.tgl_mulai)} - ${formatShortDate(b.endDate || b.tgl_selesai)}<br>
                            <i class="fas fa-clock"></i> ${days} hari
                            ${lateBadge}
                        </p>

                        <div class="motor-price">
                            <span class="price-amount">${formatRupiah(b.totalHarga || b.total_harga)}</span>
                        </div>

                        ${
                          (b.status === "paid" || b.status === "done")
                            ? `
                            <button class="btn btn-outline" style="width:100%;margin-top:1rem;" onclick="showInvoice(${b.id})">
                                <i class="fas fa-receipt"></i> Lihat Kuitansi
                            </button>
                        `
                            : b.status === "returning" 
                            ? `
                            <button class="btn btn-primary" style="width:100%;margin-top:1rem;" onclick="confirmDone(${b.id})">
                                <i class="fas fa-check-circle"></i> Konfirmasi Pelunasan & Selesai
                            </button>
                            `
                            : `
                            <div style="margin-top:1rem; padding:8px; background:#f9f9f9; text-align:center; border-radius:8px; border:1px solid #ddd; font-size:12px; color:#666;">
                                <i class="fas fa-info-circle"></i> Pelunasan dilakukan saat motor dikembalikan (Status: Returning).
                            </div>
                        `
                        }
                    </div>
                </div>
            `;
          })
          .join("");
      }
        if (!confirm("Konfirmasi verifikasi DP untuk booking ini?")) return;
        try {
            const token = sessionStorage.getItem('token');
            const res = await fetch(API_URL + '/api/bookings/' + bookingId + '/approve-dp', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }
            });
            if (res.ok) {
                showNotification('✅ Verifikasi DP berhasil! Status motor sekarang Disewa.', 'success');
                renderPayments();
            } else {
                showNotification('❌ Gagal memverifikasi DP.', 'danger');
            }
        } catch(e) {
            showNotification('❌ Terjadi kesalahan koneksi.', 'danger');
        }
      }

      // Konfirmasi Pelunasan & Selesai (Saat returning)
      async function confirmDone(bookingId) {
        if (!confirm("Konfirmasi bahwa motor sudah dikembalikan dan sisa pembayaran (pelunasan) sudah diterima?")) return;
        try {
            const token = sessionStorage.getItem('token');
            const res = await fetch(API_URL + '/api/bookings/' + bookingId + '/status', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ status: 'done' })
            });
            if (res.ok) {
                showNotification('✅ Pembayaran lunas dan sewa selesai!', 'success');
                loadData(); // fetch data baru dari server
                showInvoice(bookingId);
            } else {
                showNotification('❌ Gagal mengonfirmasi pembayaran.', 'danger');
            }
        } catch(e) {
            showNotification('❌ Terjadi kesalahan koneksi.', 'danger');
        }
      }

      // ✅ KUITANSI FINAL
      function showInvoice(bookingId) {
        const bk = allBookings.find((b) => b.id === bookingId);
        if (!bk) return;

        const content = document.getElementById("invoiceContent");
        
        // Logika Denda
        const now = new Date();
        const endDateObj = new Date(bk.endDate || bk.tgl_selesai);
        now.setHours(0,0,0,0);
        endDateObj.setHours(0,0,0,0);
        let lateDays = 0;
        let denda = 0;
        if (bk.status === "paid" || bk.status === "done") {
            if (now > endDateObj) {
                lateDays = Math.ceil((now - endDateObj) / (1000 * 60 * 60 * 24));
                denda = lateDays * 50000;
            }
        }

        const dp = bk.dpAmount || bk.dp_amount || Math.round((bk.totalHarga || bk.total_harga) / 2);
        const sisa = (bk.totalHarga || bk.total_harga) - dp + denda;
        
        // Cek jika status selesai (done/paid), maka sisa = 0 krn sdh dibayar
        const isLunas = bk.status === 'done' || bk.status === 'paid';
        const displaySisa = isLunas ? 0 : sisa;

        content.innerHTML = `
                <div style="text-align: center; margin-bottom: 2rem;">
                    <img src="../assets/img/logo.png" style="height: 40px; margin-bottom: 1rem;">
                    <h2>KUITANSI PEMBAYARAN</h2>
                    <p style="color: var(--gray-500)">No. #${bk.id} / ${formatShortDate(
          new Date()
        )}</p>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem;">
                    <div>
                        <h4 style="color: var(--gray-500); margin-bottom: 0.5rem;">Terima Dari:</h4>
                        <p style="font-weight: 500;">${bk.userName || bk.user_name}</p>
                        <p style="font-size: 0.9rem; color: var(--gray-600);">${bk.userEmail || ''}</p>
                    </div>
                    <div style="text-align: right;">
                        <h4 style="color: var(--gray-500); margin-bottom: 0.5rem;">Pembayaran Sewa:</h4>
                        <p style="font-weight: 500;">${bk.motorName || bk.motor_name}</p>
                        <p style="font-size: 0.9rem; color: var(--gray-600);">
                            ${formatShortDate(bk.startDate || bk.tgl_mulai)} s.d ${formatShortDate(bk.endDate || bk.tgl_selesai)}
                        </p>
                    </div>
                </div>

                <div style="border-top: 2px dashed #eee; border-bottom: 2px dashed #eee; padding: 1.5rem 0; margin-bottom: 2rem;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <span>Biaya Sewa (${calculateDays(bk.startDate || bk.tgl_mulai, bk.endDate || bk.tgl_selesai)} hari)</span>
                        <span>${formatRupiah(bk.totalHarga || bk.total_harga)}</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <span>Uang Muka (DP)</span>
                        <span>- ${formatRupiah(dp)}</span>
                    </div>
                    ${denda > 0 ? `
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; color: var(--danger);">
                        <span>Denda Keterlambatan (${lateDays} hari)</span>
                        <span>+ ${formatRupiah(denda)}</span>
                    </div>
                    ` : ''}
                    <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 1.2rem; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #eee;">
                        <span>Total Sisa / Dibayar Pelunasan</span>
                        <span style="color: var(--primary)">${formatRupiah(sisa)}</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; font-size: 1rem; margin-top: 1rem;">
                        <span>Status</span>
                        <span style="font-weight: bold; color: ${isLunas ? 'var(--success)' : 'var(--danger)'}">
                            ${isLunas ? 'LUNAS' : 'BELUM LUNAS'}
                        </span>
                    </div>
                </div>

                <div style="text-align: center; color: var(--gray-500); font-size: 0.9rem;">
                    <p>Terima kasih telah menggunakan layanan Ngebut.in!</p>
                    <p>Simpan kuitansi ini sebagai bukti pembayaran yang sah.</p>
                </div>
            `;
        document.getElementById("invoiceModal").style.display = "flex";
      }

      function closeInvoiceModal() {
        document.getElementById("invoiceModal").style.display = "none";
      }

      async function printInvoice() {
        const { jsPDF } = window.jspdf;
        const invoiceContent = document.getElementById("invoiceContent");
        
        const originalBg = invoiceContent.style.background;
        invoiceContent.style.background = "white";
        
        try {
            const canvas = await html2canvas(invoiceContent, {
                scale: 2,
                useCORS: true
            });
            
            const imgData = canvas.toDataURL("image/png");
            const pdf = new jsPDF("p", "mm", "a4");
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
            
            pdf.addImage(imgData, "PNG", 0, 0, pdfWidth, pdfHeight);
            
            const dateStr = new Date().getTime();
            pdf.save(`Kuitansi_NgebutIN_${dateStr}.pdf`);
            
        } catch (error) {
            console.error("Gagal membuat PDF:", error);
            alert("Terjadi kesalahan saat membuat kuitansi PDF.");
        } finally {
            invoiceContent.style.background = originalBg;
        }
      }

      document
        .getElementById("invoiceModal")
        .addEventListener("click", function (e) {
          if (e.target === this) closeInvoiceModal();
        });

      function exportToCSV() {
        const bookings = allBookings.filter(b => b.status === "paid" || b.status === "done");
        if (bookings.length === 0) {
            alert("Tidak ada data transaksi untuk diexport!");
            return;
        }

        let csvContent = "\uFEFFsep=,\n"; 
        csvContent += "ID Transaksi,Penyewa,Motor,Tanggal Sewa,Tanggal Kembali,Durasi,Total Harga,Status\n";

        const headers = ["ID Transaksi", "Penyewa", "Email", "Motor", "Tgl Mulai", "Tgl Selesai", "Durasi", "Total Bayar", "Status", "Waktu Transaksi"];
        const rows = bookings.map(b => [
            `#${b.id.toString().slice(-6)}`,
            b.userName,
            b.userEmail || "-",
            b.motorName,
            b.startDate,
            b.endDate,
            `${calculateDays(b.startDate, b.endDate)} Hari`,
            formatRupiah(b.totalHarga),
            b.status.toUpperCase(),
            b.createdAt
        ]);

        downloadCSV("Laporan_Pembayaran_NgebutIN.csv", headers, rows, "Laporan Riwayat Transaksi & Pembayaran");
      }

      loadData();
      setInterval(renderPayments, 30000);
    </script>
  </body>
</html>
