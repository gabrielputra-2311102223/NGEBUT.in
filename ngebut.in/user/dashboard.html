<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Ngebut.in</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="dashboard-layout">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="mobile-admin-nav">
        <button class="sidebar-toggle-btn" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <img src="../assets/img/logo.png" alt="Logo" style="height: 35px; mix-blend-mode: multiply;">
        <div style="width: 24px;"></div>
    </div>
    
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="../index.html" class="logo" style="display: flex; align-items: center; justify-content: center; margin-bottom: 1rem;">
                <img src="../assets/img/logo.png" alt="Ngebut.in Logo" style="height: 70px; width: auto; object-fit: contain; mix-blend-mode: multiply; filter: brightness(1.05) contrast(1.05);">
            </a>
            <div class="user-profile" id="userProfile">
                <!-- Akan diisi oleh JS -->
            </div>
        </div>
        
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item active">
                <i class="fas fa-home"></i> Dashboard
            </a>
            <a href="booking.html" class="nav-item">
                <i class="fas fa-calendar-alt"></i> Booking Saya
            </a>
            <a href="riwayat.html" class="nav-item">
                <i class="fas fa-history"></i> Riwayat
            </a>
            <a href="profil.html" class="nav-item">
                <i class="fas fa-user-circle"></i> Profil
            </a>
            <a href="#" class="nav-item logout" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <div class="page-header">
            <div class="page-title">
                <h1>Selamat Datang, <span id="userName"></span>! 👋</h1>
                <p>Pilih motor favoritmu dan mulai perjalananmu sekarang</p>
            </div>
        </div>

        <!-- ACTIVE RENTAL AREA (NEW) -->
        <div id="activeRentalArea"></div>

        <!-- NOTIFICATION AREA -->
        <div id="notificationArea"></div>

        <!-- FILTER BAR -->
        <div class="filter-bar">
            <div class="search-box">
                <i class="fas fa-search" style="color: var(--gray-400);"></i>
                <input type="text" id="searchInput" placeholder="Cari motor..." onkeyup="renderKatalog()">
                <button onclick="renderKatalog()">Cari</button>
            </div>
            <div class="filter-tabs">
                <button class="filter-tab active" onclick="setFilter('all', this)">🏍️ Semua</button>
                <button class="filter-tab" onclick="setFilter('available', this)">✅ Tersedia</button>
                <button class="filter-tab" onclick="setKategori('matic', this)">⚡ Matic</button>
                <button class="filter-tab" onclick="setKategori('manual', this)">🔧 Manual</button>
                <button class="filter-tab" onclick="setKategori('sport', this)">🏁 Sport</button>
            </div>
        </div>

        <!-- MOTOR GRID -->
        <div id="motorGrid" class="motor-grid"></div>
    </main>

    <!-- MODAL BOOKING -->
    <div id="bookingModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalMotorName">Pesan Motor</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Nama Penyewa</label>
                    <input type="text" id="bookingNama" readonly style="background: var(--gray-100);">
                </div>
                <div class="form-group">
                    <label>Tanggal Mulai Sewa</label>
                    <input type="date" id="tglMulai" onchange="hitungTotal()" min="">
                </div>
                <div class="form-group">
                    <label>Tanggal Selesai Sewa</label>
                    <input type="date" id="tglSelesai" onchange="hitungTotal()" min="">
                </div>
                <div style="background: var(--gray-50); padding: 1.25rem; border-radius: var(--radius-lg); margin-top: 1rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-weight: 600;">Total Pembayaran</span>
                        <span id="totalBayarText" style="font-size: 1.5rem; font-weight: 800; color: var(--primary);">Rp 0</span>
                    </div>
                    <p style="color: var(--gray-500); font-size: 0.875rem; margin-top: 0.5rem;">
                        <i class="fas fa-info-circle"></i> Harga dihitung per hari
                    </p>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal()">Batal</button>
                <button class="btn btn-primary" onclick="prosesBooking()">Pesan Sekarang</button>
            </div>
        </div>
    </div>

    <script src="../assets/js/api-client.js"></script>
    <script src="../assets/js/script.js"></script>
    <script>
    const user = getCurrentUser();
    if (!user || user.role !== 'user') window.location.href = '../login.html';

    let currentFilter = 'all';
    let currentKategori = '';
    let selectedMotorId = null;
    let allMotors = [];
    let userBookings = [];

    document.getElementById('userName').innerText = user.nama;
    document.getElementById('userProfile').innerHTML = `
        <div class="user-avatar" id="userAvatar"></div>
        <div class="user-info">
            <h4>${user.nama}</h4>
            <p><i class="fas fa-user"></i> Member</p>
        </div>
    `;
    renderAvatar('#userAvatar', user.nama, user.foto_profil, 50);

    function setFilter(status, el) {
        currentFilter = status;
        currentKategori = '';
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        if (el) el.classList.add('active');
        renderKatalog();
    }
    function setKategori(kat, el) {
        currentKategori = kat;
        currentFilter = 'all';
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        if (el) el.classList.add('active');
        renderKatalog();
    }

    async function loadData() {
        try {
            [allMotors, userBookings] = await Promise.all([
                ApiClient.get('/motors'),
                ApiClient.get(`/bookings/my/${user.id}`).catch(() => [])
            ]);
            renderActiveRentals();
            renderKatalog();
        } catch (e) {
            document.getElementById('motorGrid').innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:3rem;color:#9ca3af;"><i class="fas fa-wifi" style="font-size:3rem;opacity:0.3;"></i><p>Gagal memuat katalog: ${e.message}</p></div>`;
        }
    }

    function renderActiveRentals() {
        const active = userBookings.filter(b => ['confirmed','returning','pending'].includes(b.status));
        const area = document.getElementById('activeRentalArea');
        if (active.length === 0) { area.innerHTML = ''; return; }

        const statusMap = {
            pending:   { label: '⏳ Upload DP', color: '#92400e', bg: '#fefce8', link: 'booking.html' },
            confirmed: { label: '🏍️ Aktif Disewa', color: '#166534', bg: '#f0fdf4', link: 'booking.html' },
            returning: { label: '↩️ Proses Kembali', color: '#5b21b6', bg: '#faf5ff', link: 'booking.html' },
        };

        area.innerHTML = `
            <div style="background:white;padding:1.5rem;border-radius:16px;border-left:5px solid var(--primary);margin-bottom:2rem;box-shadow:0 2px 12px rgba(0,0,0,.06);">
                <h3 style="margin:0 0 1rem;color:var(--secondary);font-size:16px;">
                    <i class="fas fa-motorcycle" style="color:var(--primary);"></i> Sewa Aktif Kamu
                </h3>
                ${active.map(b => {
                    const sm = statusMap[b.status] || { label: b.status, color:'#374151', bg:'#f3f4f6', link:'booking.html' };
                    const endDate = b.endDate ? new Date(b.endDate).toLocaleDateString('id-ID') : '-';
                    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:${sm.bg};border-radius:10px;margin-bottom:8px;">
                        <div>
                            <strong style="font-size:14px;">${b.motorName||'Motor'}</strong>
                            <span style="font-size:11px;font-weight:700;background:${sm.bg};color:${sm.color};border:1px solid ${sm.color};padding:2px 8px;border-radius:99px;margin-left:8px;">${sm.label}</span><br>
                            <small style="color:#6b7280;">Hingga: ${endDate}</small>
                        </div>
                        <a href="booking.html" style="background:var(--primary);color:white;border:none;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;text-decoration:none;">
                            <i class="fas fa-arrow-right"></i> Detail
                        </a>
                    </div>`;
                }).join('')}
            </div>`;
    }

    function renderKatalog() {
        const search = document.getElementById('searchInput')?.value.toLowerCase() || '';
        const grid = document.getElementById('motorGrid');

        let filtered = allMotors.filter(m => {
            const nama = (m.nama || m.name || '').toLowerCase();
            const kat = (m.kategori || m.tipe || '').toLowerCase();
            const matchSearch = nama.includes(search);
            const matchStatus = currentFilter === 'all' || m.status === currentFilter;
            const matchKat = !currentKategori || kat.includes(currentKategori);
            return matchSearch && matchStatus && matchKat;
        });

        if (filtered.length === 0) {
            grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:4rem;color:var(--gray-500);">
                <i class="fas fa-motorcycle" style="font-size:3rem;opacity:0.3;margin-bottom:1rem;display:block;"></i>
                <h3>Tidak ada motor ditemukan</h3>
                <p style="font-size:13px;">${currentKategori ? 'Coba kategori lain' : 'Coba pencarian lain'}</p>
            </div>`;
            return;
        }

        grid.innerHTML = filtered.map(m => {
            const motorNama = m.nama || m.name || 'Motor';
            const harga = m.harga || m.price || 0;
            const gambar = m.gambar || m.image || '';
            const kat = m.kategori || m.tipe || '';

            let statusClass = '', statusText = '';
            if (m.status === 'available') { statusClass = 'badge-available'; statusText = 'TERSEDIA'; }
            else if (m.status === 'booked') { statusClass = 'badge-booked'; statusText = 'DISEWA'; }
            else { statusClass = 'badge-service'; statusText = 'SERVICE'; }

            return `<div class="motor-card">
                <div class="motor-image">
                    <img src="${getMotorImage(gambar)}" alt="${motorNama}" onerror="this.src='https://placehold.co/400x300/1A1A1A/white?text=${motorNama}'">
                    <span class="motor-badge ${statusClass}">${statusText}</span>
                    ${kat ? `<span style="position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.7);color:#fff;font-size:10px;padding:3px 8px;border-radius:99px;">${kat.toUpperCase()}</span>` : ''}
                </div>
                <div class="motor-content">
                    <h3 class="motor-title">${motorNama}</h3>
                    <p class="motor-desc">${m.desc || m.deskripsi || 'Motor berkualitas, siap pakai'}</p>
                    <div class="motor-price">
                        <span class="price-amount">${formatRupiah(harga)}</span>
                        <span class="price-unit">/hari</span>
                    </div>
                    <button class="btn btn-book" style="width:100%;" onclick="openBookingModal(${m.id})" ${m.status !== 'available' ? 'disabled' : ''}>
                        <i class="fas fa-bolt"></i> ${m.status === 'available' ? 'Sewa Sekarang' : 'Tidak Tersedia'}
                    </button>
                </div>
            </div>`;
        }).join('');
    }

    function openBookingModal(motorId) {
        selectedMotorId = motorId;
        const motor = allMotors.find(m => m.id === motorId || String(m.id) === String(motorId));
        if (!motor) return;
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('tglMulai').min = today;
        document.getElementById('tglSelesai').min = today;
        document.getElementById('modalMotorName').innerText = `Sewa ${motor.nama || motor.name}`;
        document.getElementById('bookingNama').value = user.nama;
        document.getElementById('tglMulai').value = '';
        document.getElementById('tglSelesai').value = '';
        document.getElementById('totalBayarText').innerText = 'Rp 0';
        document.getElementById('bookingModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('bookingModal').style.display = 'none';
        selectedMotorId = null;
    }

    function hitungTotal() {
        if (!selectedMotorId) return 0;
        const s = document.getElementById('tglMulai').value;
        const e = document.getElementById('tglSelesai').value;
        if (!s || !e) { document.getElementById('totalBayarText').innerText = 'Rp 0'; return 0; }
        const days = calculateDays(s, e);
        const motor = allMotors.find(m => m.id === selectedMotorId || String(m.id) === String(selectedMotorId));
        if (!motor) return 0;
        const total = days * Number(motor.harga || motor.price || 0);
        document.getElementById('totalBayarText').innerText = formatRupiah(total);
        return total;
    }

    async function prosesBooking() {
        if (!selectedMotorId) return;
        const s = document.getElementById('tglMulai').value;
        const e = document.getElementById('tglSelesai').value;
        if (!s || !e) { alert('Pilih tanggal sewa terlebih dahulu.'); return; }
        const total = hitungTotal();
        if (total <= 0) { alert('Durasi sewa minimal 1 hari.'); return; }

        const motor = allMotors.find(m => m.id === selectedMotorId || String(m.id) === String(selectedMotorId));
        if (!motor || motor.status !== 'available') { alert('Motor sudah tidak tersedia.'); return; }

        const btn = document.querySelector('.modal-footer .btn-primary');
        if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...'; }

        try {
            const data = await ApiClient.post('/bookings', {
                user_id: user.id,
                motor_id: selectedMotorId,
                tgl_mulai: s,
                tgl_selesai: e,
                total_harga: total
            });
            closeModal();
            await loadData();
            // Tampilkan notif lalu redirect
            const notif = document.createElement('div');
            notif.className = 'notification notification-success';
            notif.innerHTML = `<span class="notification-icon"><i class="fas fa-check-circle"></i></span>
                <div class="notification-content"><div class="notification-title">Booking berhasil! Silakan upload bukti DP.</div></div>
                <span class="notification-close" onclick="this.parentElement.remove()">&times;</span>`;
            document.body.appendChild(notif);
            setTimeout(() => { window.location.href = 'booking.html'; }, 2000);
        } catch (err) {
            const msg = err.message || 'Gagal melakukan booking';
            showDialog('Booking Gagal', msg);
        } finally {
            if (btn) { btn.disabled = false; btn.innerHTML = 'Pesan Sekarang'; }
        }
    }

    function showDialog(title, msg) {
        const d = document.createElement('div');
        d.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
        d.innerHTML = `<div style="background:#fff;border-radius:16px;padding:24px;max-width:380px;width:100%;">
            <h3 style="margin:0 0 8px;color:#cc0000;">${title}</h3>
            <p style="margin:0 0 16px;color:#374151;font-size:14px;">${msg}</p>
            <button onclick="this.closest('div[style]').remove()" style="background:#cc0000;color:#fff;border:none;padding:10px 24px;border-radius:8px;cursor:pointer;font-weight:600;">OK</button>
        </div>`;
        document.body.appendChild(d);
    }

    document.getElementById('bookingModal').addEventListener('click', e => { if (e.target === document.getElementById('bookingModal')) closeModal(); });

    document.getElementById('sidebarToggle')?.addEventListener('click', () => {
        document.querySelector('.sidebar')?.classList.toggle('open');
        document.getElementById('sidebarOverlay')?.classList.toggle('show');
    });
    document.getElementById('sidebarOverlay')?.addEventListener('click', () => {
        document.querySelector('.sidebar')?.classList.remove('open');
        document.getElementById('sidebarOverlay')?.classList.remove('show');
    });

    loadData();
    </script>
</body>
</html>
