<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Booking - Ngebut.in</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="dashboard-layout">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="mobile-admin-nav">
        <button class="sidebar-toggle-btn" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <img src="../assets/img/logo.png" alt="Logo" style="height: 35px; mix-blend-mode: multiply;">
        <div style="width: 24px;"></div>
    </div>
    
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="../index.html" class="logo" style="display: flex; align-items: center; justify-content: center; margin-bottom: 1rem;">
                <img src="../assets/img/logo.png" alt="Ngebut.in Logo" style="height: 70px; width: auto; object-fit: contain; mix-blend-mode: multiply; filter: brightness(1.05) contrast(1.05);">
            </a>
            <div class="user-profile" id="userProfile"></div>
        </div>
        
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-home"></i> Dashboard
            </a>
            <a href="booking.html" class="nav-item">
                <i class="fas fa-calendar-alt"></i> Booking Saya
            </a>
            <a href="riwayat.html" class="nav-item active">
                <i class="fas fa-history"></i> Riwayat
            </a>
            <a href="profil.html" class="nav-item">
                <i class="fas fa-user-circle"></i> Profil
            </a>
            <a href="#" class="nav-item logout" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <div class="page-title">
                <h1>Riwayat Booking</h1>
                <p>Daftar transaksi yang sudah selesai</p>
            </div>
        </div>

        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Motor</th>
                        <th>Tanggal Sewa</th>
                        <th>Tanggal Kembali</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="riwayatList">
                    <tr><td colspan="6" style="text-align: center; padding: 2rem;">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- HIDDEN INVOICE TEMPLATE FOR PRINTING -->
        <div id="invoiceTemplate" style="display:none; width:600px; padding:20px; background:white; color:black;">
            <div id="invoiceContent" class="invoice-wrap">
                <!-- Content will be injected here -->
            </div>
        </div>
    </main>

    <script src="../assets/js/api-client.js"></script>
    <script src="../assets/js/script.js"></script>
    <script>
    const user = getCurrentUser();
    if (!user || user.role !== 'user') window.location.href = '../login.html';

    document.getElementById('userProfile').innerHTML = `
        <div class="user-avatar" id="userAvatar"></div>
        <div class="user-info">
            <h4>${user.nama}</h4>
            <p><i class="fas fa-user"></i> Member</p>
        </div>
    `;
    renderAvatar('#userAvatar', user.nama, user.foto_profil, 50);

    let allBookings = [];

    function statusBadgeHTML(status) {
        const map = {
            completed: { label: '✅ Selesai',    bg: '#dcfce7', color: '#166534' },
            returning: { label: '↩️ Kembali',    bg: '#ede9fe', color: '#5b21b6' },
            rejected:  { label: '❌ Ditolak',    bg: '#fee2e2', color: '#991b1b' },
            cancelled: { label: '🚫 Dibatalkan', bg: '#f3f4f6', color: '#374151' },
        };
        const s = map[status] || { label: (status||'-').toUpperCase(), bg: '#f3f4f6', color: '#374151' };
        return `<span style="padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;background:${s.bg};color:${s.color};">${s.label}</span>`;
    }

    async function renderRiwayat() {
        try {
            const data = await ApiClient.get(`/bookings/my/${user.id}`);
            allBookings = Array.isArray(data) ? data : [];
            // Riwayat = semua yang bukan aktif (pending/confirmed)
            const riwayat = allBookings
                .filter(b => ['completed','returning','cancelled','rejected'].includes(b.status))
                .sort((a, b) => new Date(b.createdAt||0) - new Date(a.createdAt||0));

            const tbody = document.getElementById('riwayatList');

            if (riwayat.length === 0) {
                document.querySelector('.data-table thead').style.display = 'none';
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:3rem;border:none;">
                    <i class="fas fa-history" style="font-size:3rem;opacity:0.3;display:block;margin-bottom:1rem;"></i>
                    <h3 style="color:#9ca3af;">Belum ada riwayat transaksi</h3>
                    <a href="booking.html" class="btn btn-primary" style="margin-top:1rem;display:inline-block;">
                        <i class="fas fa-motorcycle"></i> Mulai Sewa
                    </a>
                </td></tr>`;
                return;
            }

            document.querySelector('.data-table thead').style.display = '';
            tbody.innerHTML = riwayat.map(b => {
                const total = b.totalHarga || 0;
                const dp = b.dpAmount || 0;
                const pelunasan = b.pelunasanAmount || (total - dp);
                return `<tr>
                    <td><strong>${b.motorName||'-'}</strong><br><small style="color:#9ca3af;">${b.motorKategori||''}</small></td>
                    <td>${formatShortDate(b.startDate)}</td>
                    <td>${formatShortDate(b.endDate)}</td>
                    <td>
                        <strong>${formatRupiah(total)}</strong><br>
                        <small style="color:#059669;font-size:11px;">DP: ${formatRupiah(dp)}</small><br>
                        <small style="color:#cc0000;font-size:11px;">Sisa: ${formatRupiah(pelunasan)}</small>
                    </td>
                    <td>${statusBadgeHTML(b.status)}</td>
                    <td>
                        ${b.status === 'completed'
                            ? `<button class="btn btn-outline" style="padding:0.4rem 0.8rem;font-size:12px;" onclick="viewKwitansi(${b.id})">
                                <i class="fas fa-receipt"></i> Kwitansi
                              </button>`
                            : '<span style="color:#9ca3af;font-size:12px;">—</span>'
                        }
                    </td>
                </tr>`;
            }).join('');
        } catch (e) {
            document.getElementById('riwayatList').innerHTML = `<tr><td colspan="6" style="text-align:center;color:red;">Gagal memuat: ${e.message}</td></tr>`;
        }
    }

    function viewKwitansi(bookingId) {
        const b = allBookings.find(x => String(x.id) === String(bookingId));
        if (!b) return;
        const total = b.totalHarga || 0;
        const dp = b.dpAmount || 0;
        const pelunasan = b.pelunasanAmount || (total - dp);
        const days = calculateDays(b.startDate, b.endDate);
        const win = window.open('', '_blank');
        win.document.write(`<!DOCTYPE html><html><head><title>Kwitansi #${String(b.id).slice(-6)}</title>
        <style>
            body{font-family:Arial,sans-serif;max-width:600px;margin:40px auto;padding:20px;}
            .header{text-align:center;border-bottom:3px solid #cc0000;padding-bottom:15px;margin-bottom:20px;}
            .logo{font-size:28px;font-weight:900;color:#cc0000;}
            .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0;}
            .label{color:#666;font-size:14px;} .value{font-weight:600;font-size:14px;}
            .total-box{background:#fff5f5;padding:14px;border-radius:8px;margin-top:16px;}
            .lunas{text-align:center;margin:20px 0;padding:12px;background:#dcfce7;border-radius:8px;color:#166534;font-weight:700;font-size:20px;}
            @media print{button{display:none}}
        </style></head><body>
        <div class="header"><div class="logo">🏍️ NGEBUT.IN</div>
        <h3 style="margin:8px 0;color:#333;">KWITANSI SEWA MOTOR</h3>
        <small style="color:#666;">No. Transaksi: <strong>#${String(b.id).slice(-6)}</strong></small></div>
        <div class="row"><span class="label">Tanggal</span><span class="value">${new Date(b.createdAt).toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'})}</span></div>
        <div class="row"><span class="label">Penyewa</span><span class="value">${b.userName||user.nama}</span></div>
        <div class="row"><span class="label">Motor</span><span class="value">${b.motorName||'-'} (${b.motorKategori||'-'})</span></div>
        <div class="row"><span class="label">Tanggal Mulai</span><span class="value">${b.startDate||'-'}</span></div>
        <div class="row"><span class="label">Tanggal Kembali</span><span class="value">${b.endDate||'-'}</span></div>
        <div class="row"><span class="label">Durasi</span><span class="value">${days} hari</span></div>
        <div class="total-box">
            <div class="row" style="border:none;padding:4px 0;"><span class="label">Total Sewa</span><span class="value">Rp ${Number(total).toLocaleString('id-ID')}</span></div>
            <div class="row" style="border:none;padding:4px 0;"><span class="label">DP (50%)</span><span class="value" style="color:#059669;">Rp ${Number(dp).toLocaleString('id-ID')}</span></div>
            <div class="row" style="border:none;padding:4px 0;"><span class="label">Pelunasan (50%)</span><span class="value" style="color:#cc0000;">Rp ${Number(pelunasan).toLocaleString('id-ID')}</span></div>
        </div>
        <div class="lunas">✅ LUNAS</div>
        <p style="text-align:center;color:#9ca3af;font-size:12px;">Terima kasih telah menggunakan layanan NGEBUT.IN</p>
        <div style="text-align:center;margin-top:16px;">
            <button onclick="window.print()" style="background:#cc0000;color:#fff;border:none;padding:12px 28px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;">🖨️ Cetak / Simpan PDF</button>
        </div></body></html>`);
        win.document.close();
    }

    document.getElementById('sidebarToggle')?.addEventListener('click', () => {
        document.querySelector('.sidebar')?.classList.toggle('open');
        document.getElementById('sidebarOverlay')?.classList.toggle('show');
    });
    document.getElementById('sidebarOverlay')?.addEventListener('click', () => {
        document.querySelector('.sidebar')?.classList.remove('open');
        document.getElementById('sidebarOverlay')?.classList.remove('show');
    });

    // ✅ Panggil fungsi utama
    renderRiwayat();
    </script>
</body>
</html>
