<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Booking - Ngebut.in</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="dashboard-layout">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="mobile-admin-nav">
        <button class="sidebar-toggle-btn" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <img src="../assets/img/logo.png" alt="Logo" style="height: 35px; mix-blend-mode: multiply;">
        <div style="width: 24px;"></div>
    </div>
    
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="../index.html" class="logo" style="display: flex; align-items: center; justify-content: center; margin-bottom: 1rem;">
                <img src="../assets/img/logo.png" alt="Ngebut.in Logo" style="height: 70px; width: auto; object-fit: contain; mix-blend-mode: multiply; filter: brightness(1.05) contrast(1.05);">
            </a>
            <div class="user-profile" id="userProfile"></div>
        </div>
        
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-home"></i> Dashboard
            </a>
            <a href="booking.html" class="nav-item">
                <i class="fas fa-calendar-alt"></i> Booking Saya
            </a>
            <a href="riwayat.html" class="nav-item active">
                <i class="fas fa-history"></i> Riwayat
            </a>
            <a href="#" class="nav-item logout" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <div class="page-title">
                <h1>Riwayat Booking</h1>
                <p>Daftar transaksi yang sudah selesai</p>
            </div>
        </div>

        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Motor</th>
                        <th>Tanggal Sewa</th>
                        <th>Tanggal Kembali</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="riwayatList">
                    <tr><td colspan="6" style="text-align: center; padding: 2rem;">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- HIDDEN INVOICE TEMPLATE FOR PRINTING -->
        <div id="invoiceTemplate" style="display:none; width:600px; padding:20px; background:white; color:black;">
            <div id="invoiceContent" class="invoice-wrap">
                <!-- Content will be injected here -->
            </div>
        </div>
    </main>

    <script src="../assets/js/api-client.js"></script>
    <script src="../assets/js/script.js"></script>
    <script>
    const user = getCurrentUser();
    if (!user) window.location.href = '../login.html';

    document.getElementById('userProfile').innerHTML = `
        <div class="user-avatar">${user.nama.charAt(0).toUpperCase()}</div>
        <div class="user-info">
            <h4>${user.nama}</h4>
            <p><i class="fas fa-user"></i> Member</p>
        </div>
    `;

    function renderRiwayat() {
        // ✔ pastikan status auto update dulu
        syncAutoDone();

        // ✔ ambil data terbaru setelah update
        const allBookings = getBooking();

        const bookings = allBookings.filter(b => 
            String(b.userId) === String(user.id) && 
            ['done', 'cancelled'].includes(b.status)
        );
        
        const tbody = document.getElementById('riwayatList');
        
        if (bookings.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 3rem; color: var(--gray-500);">
                <i class="fas fa-history" style="font-size: 3rem; opacity: 0.3; margin-bottom: 1rem;"></i>
                <h3>Belum ada riwayat booking</h3>
            </td></tr>`;
            return;
        }

        tbody.innerHTML = bookings
            .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
            .map(b => `
                <tr>
                    <td><strong>${b.motorName}</strong></td>
                    <td>${formatShortDate(b.startDate)}</td>
                    <td>${formatShortDate(b.endDate)}</td>
                    <td>${formatRupiah(b.totalHarga)}</td>
                    <td>${getStatusBadge(b.status)}</td>
                    <td>
                        <button class="btn btn-outline" style="padding: 0.5rem 1rem;" onclick="downloadInvoice(${b.id})">
                            <i class="fas fa-file-pdf"></i> Kwitansi
                        </button>
                    </td>
                </tr>
            `).join('');
    }

    async function downloadInvoice(bookingId) {
        const bookings = getBooking();
        const booking = bookings.find(b => String(b.id) === String(bookingId));
        if(!booking) return;

        const days = calculateDays(booking.startDate, booking.endDate);
        const tarif = booking.totalHarga / days;

        document.getElementById("invoiceContent").innerHTML = `
            <div>
                <div style="display:flex; justify-content:space-between;">
                    <div>
                        <h2><span style="color:#cc0000;">NGEBUT</span>.IN</h2>
                        <p style="line-height:1.8;">
                            Jalan DI Panjaitan No. 128<br>
                            Purwokerto Selatan, Banyumas<br>
                            Telp: (022) 123-4567<br>
                            Halo@ngebut.in
                        </p>
                    </div>
                    <div style="text-align:right;">
                        <h2>KUITANSI SEWA</h2>
                        <p>INVOICE: #${booking.id.toString().slice(-6)}</p>
                        <p>TANGGAL: ${new Date().toLocaleDateString("id-ID", {day: "2-digit", month: "2-digit", year: "numeric"})}</p>
                    </div>
                </div>
                <hr style="margin:25px 0;">
                <div style="border-left:5px solid #cc0000;padding-left:15px;">
                    <h3>Informasi Penyewa</h3>
                    <p><b>Nama:</b> ${booking.userName}</p>
                </div>
                <table style="width:100%;margin-top:30px;border-collapse:collapse;text-align:left;">
                    <tr style="color:#999;">
                        <th>Kendaraan</th>
                        <th>Ambil</th>
                        <th>Kembali</th>
                        <th>Durasi</th>
                        <th>Total</th>
                    </tr>
                    <tr style="border-top:1px solid #ddd;">
                        <td><b>${booking.motorName}</b></td>
                        <td>${formatShortDate(booking.startDate)}</td>
                        <td>${formatShortDate(booking.endDate)}</td>
                        <td>${days} Hari</td>
                        <td><b>${formatRupiah(booking.totalHarga)}</b></td>
                    </tr>
                </table>
                <div style="text-align:right; margin-top:40px;">
                    <p style="margin-bottom:5px; font-size:14px; color:#666;">GRAND TOTAL</p>
                    <h2 style="color:#cc0000; font-size:28px; margin:0;">${formatRupiah(booking.totalHarga)}</h2>
                </div>
                <div class="invoice-footer" style="margin-top: 40px; font-size: 12px; color: #888;">
                    Dokumen ini sah dikeluarkan oleh Sistem Ngebut.in.<br>
                    Terima kasih telah mempercayakan perjalanan Anda kepada Ngebut.in 🚀
                </div>
            </div>
        `;

        const template = document.getElementById("invoiceTemplate");
        template.style.display = "block"; // temporarily show to render
        
        try {
            const { jsPDF } = window.jspdf;
            const canvas = await html2canvas(document.getElementById("invoiceContent"), {
                scale: 2,
                useCORS: true
            });
            const imgData = canvas.toDataURL("image/png");
            const pdf = new jsPDF("p", "mm", "a4");
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
            pdf.addImage(imgData, "PNG", 0, 0, pdfWidth, pdfHeight);
            pdf.save(`Kuitansi_NgebutIN_${booking.id}.pdf`);
        } catch (error) {
            console.error("PDF Error", error);
            alert("Gagal mengunduh kwitansi");
        } finally {
            template.style.display = "none";
        }
    }

    renderRiwayat();
    setInterval(renderRiwayat, 10000);
</script>
